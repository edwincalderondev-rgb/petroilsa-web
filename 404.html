<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada | Petroil S.A.</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="270x270" href="/assets/img/cropped-favicon-petroil-270x270.png">
<meta name="theme-color" content="#080C41">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/base.css">
<style>
  body{
    min-height:100vh; min-height:100svh; display:flex; flex-direction:column;
    background-color:var(--brand-navy);
    background-image:linear-gradient(135deg, var(--navy) 0%, var(--teal) 70%, var(--teal-light) 130%);
    color:var(--brand-white);
  }
  .nf-top{padding:28px 0;}
  .nf-top img{height:56px; width:auto;}
  .nf-main{flex:1; display:flex; align-items:center; padding:24px 0 72px;}
  .nf-main > .container{width:100%;}
  .nf-code{
    font-size:clamp(4.5rem, 14vw, 8.5rem); font-weight:800; line-height:1; letter-spacing:-.04em;
    color:var(--brand-lime); margin-bottom:12px;
  }
  .nf-main h1{font-size:clamp(1.6rem, 4vw, 2.4rem); line-height:1.2; margin-bottom:14px; text-wrap:balance;}
  .nf-main p{color:var(--brand-gray); max-width:46ch; font-size:1.02rem;}
  .nf-main p + p{margin-top:6px; font-size:.9rem;}
  .nf-actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:32px;}
  .nf-foot{padding:20px 0 28px; font-size:.82rem; color:var(--brand-gray); border-top:1px solid rgba(251,254,255,.12);}
  .nf-foot a{color:var(--brand-white); text-decoration:underline; text-underline-offset:3px;}
  @media (max-width:560px){ .container{padding:0 20px;} .nf-actions a{flex:1 1 100%; justify-content:center;} }
</style>
</head>
<body>

<header class="nf-top">
  <div class="container">
    <a href="/"><img src="/assets/img/Petroil-logo-blanco.png" alt="Petroil S.A." width="220" height="148"></a>
  </div>
</header>

<main class="nf-main">
  <div class="container">
    <div class="nf-code" aria-hidden="true">404</div>
    <h1 data-t="h1">No encontramos esta página</h1>
    <p data-t="p">Puede que la dirección haya cambiado con el nuevo sitio de Petroil o que ya no esté disponible.</p>
    <p lang="en" id="nfAlt">This page could not be found.</p>
    <div class="nf-actions">
      <a class="btn-primary" href="/" data-t="home">Ir al inicio</a>
      <a class="btn-outline" href="/productos.html" data-t="prod">Ver productos</a>
      <a class="btn-outline" href="/contacto.html" data-t="contact">Contacto</a>
    </div>
  </div>
</main>

<footer class="nf-foot">
  <div class="container">
    Petroil S.A. · <a href="mailto:contacto@petroilsa.com">contacto@petroilsa.com</a>
  </div>
</footer>

<script>
  // Mismo idioma que el resto del sitio. Esta página no carga i18n.js: Apache la
  // sirve a cualquier profundidad y no lleva diccionario.
  (function () {
    var T = {
      en: { title: 'Page not found | Petroil S.A.', h1: 'We couldn’t find this page', p: 'The address may have changed with the new Petroil website, or the page is no longer available.', home: 'Go to home', prod: 'View products', contact: 'Contact' },
      pt: { title: 'Página não encontrada | Petroil S.A.', h1: 'Não encontramos esta página', p: 'O endereço pode ter mudado com o novo site da Petroil ou a página não está mais disponível.', home: 'Ir para o início', prod: 'Ver produtos', contact: 'Contato' }
    };
    var lang;
    try { lang = localStorage.getItem('petroil-lang'); } catch (e) {}
    var t = T[lang];
    if (!t) return;
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')]; });
    document.getElementById('nfAlt').hidden = true;
  })();
</script>

</body>
</html>
